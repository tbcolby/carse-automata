[package]
name = "carse-core"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Pure logic for Carse Automata: grid, hidden rules, epochs, record formats, input timing. No Xous dependencies."
license = "Apache-2.0"

# Keep this crate free of xous/gam/pddb so `cargo test` runs on any machine.
[dependencies]
# Pure appkit parts (fail-closed entropy). Git so `cargo test` works in this
# repo; bin/integrate patches it to the in-tree copy.
precursor-appkit-core = { git = "https://github.com/tbcolby/xous-dev-toolkit" }

[dev-dependencies]
precursor-appkit-core = { git = "https://github.com/tbcolby/xous-dev-toolkit", features = ["testing"] }
